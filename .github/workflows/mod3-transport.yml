name: Exact MOD3 product transport controls
on:
  push:
    paths:
      - 'expeditions/026-mod3-product-transport/verify.py'
      - 'expeditions/026-mod3-product-transport/result.json'
      - '.github/workflows/mod3-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exact substitution, coupling and hostile controls
        working-directory: expeditions/026-mod3-product-transport
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          python verify.py > actual.json
          python -O verify.py > optimized.json
          cmp actual.json optimized.json
          python - <<'PY'
          import json
          if json.load(open('actual.json')) != json.load(open('result.json')):
              raise RuntimeError('actual/saved output mismatch')
          print('PASS: normal/-O byte equality and actual/saved JSON equality')
          PY
          cat actual.json
