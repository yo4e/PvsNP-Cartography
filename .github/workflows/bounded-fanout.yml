name: Bounded fanout precision
on:
  push:
    branches: [main]
    paths:
      - 'expeditions/044-bounded-fanout/*.py'
      - 'expeditions/044-bounded-fanout/*.json'
      - 'expeditions/040-recursive-verifier/*.py'
      - 'expeditions/039-unary-overlap-counting/verify_base_acsp.py'
      - 'expeditions/038-recursive-query-fibers/verify_recursive.py'
      - 'expeditions/042-accepted-sites/check_overlap.py'
      - '.github/workflows/bounded-fanout.yml'
  pull_request:
    paths:
      - 'expeditions/044-bounded-fanout/*.py'
      - 'expeditions/044-bounded-fanout/*.json'
      - 'expeditions/040-recursive-verifier/*.py'
      - 'expeditions/039-unary-overlap-counting/verify_base_acsp.py'
      - 'expeditions/038-recursive-query-fibers/verify_recursive.py'
      - 'expeditions/042-accepted-sites/check_overlap.py'
      - '.github/workflows/bounded-fanout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: expeditions/044-bounded-fanout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reproduce actual compiler and adversarial controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          python check_fanout.py --scalar > "$RUNNER_TEMP/fanout.json"
          python -O check_fanout.py --scalar > "$RUNNER_TEMP/fanout-optimized.json"
          cmp fanout-checks.json "$RUNNER_TEMP/fanout.json"
          cmp fanout-checks.json "$RUNNER_TEMP/fanout-optimized.json"
          sha256sum fanout-checks.json
          cat fanout-checks.json
          while read -r script expected; do
            python "$script" > "$RUNNER_TEMP/actual.json"
            python -O "$script" > "$RUNNER_TEMP/optimized.json"
            cmp "$expected" "$RUNNER_TEMP/actual.json"
            cmp "$expected" "$RUNNER_TEMP/optimized.json"
            sha256sum "$expected"
            cat "$expected"
          done <<'CASES'
          check_query_maps.py query-map-checks.json
          check_weighted_copy.py weighted-copy-checks.json
          CASES
