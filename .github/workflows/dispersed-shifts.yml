name: Dispersed RS shifts
on:
  push:
    branches: [main]
    paths:
      - 'expeditions/043-dispersed-shifts/*.py'
      - 'expeditions/043-dispersed-shifts/*.json'
      - 'expeditions/042-accepted-sites/check_overlap.py'
      - '.github/workflows/dispersed-shifts.yml'
  pull_request:
    paths:
      - 'expeditions/043-dispersed-shifts/*.py'
      - 'expeditions/043-dispersed-shifts/*.json'
      - 'expeditions/042-accepted-sites/check_overlap.py'
      - '.github/workflows/dispersed-shifts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: expeditions/043-dispersed-shifts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reproduce four exact controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          while read -r script expected; do
            python "$script" > "$RUNNER_TEMP/actual.json"
            python -O "$script" > "$RUNNER_TEMP/optimized.json"
            cmp "$expected" "$RUNNER_TEMP/actual.json"
            cmp "$expected" "$RUNNER_TEMP/optimized.json"
            sha256sum "$expected"
            cat "$expected"
          done <<'CASES'
          check_incidence.py incidence-checks.json
          check_dense_masks.py dense-mask-checks.json
          check_packed_sampler.py packed-sampler-checks.json
          check_compiler_cost.py compiled-cost-checks.json
          CASES
