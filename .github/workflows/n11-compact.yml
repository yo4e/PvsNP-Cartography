name: n11 compact three-orbit certificate

on:
  push:
    branches: ["main"]
    paths:
      - "expeditions/015-n11-mixture/verify.py"
      - "expeditions/015-n11-mixture/compact-verify.py"
      - "expeditions/015-n11-mixture/compact-certificate.json"
      - "expeditions/015-n11-mixture/compact-result.json"
      - ".github/workflows/n11-compact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exact compact pointwise checks and saved-result equality
        shell: bash
        run: |
          set -euo pipefail
          python expeditions/015-n11-mixture/compact-verify.py | tee /tmp/n11-compact-normal.json
          python -O expeditions/015-n11-mixture/compact-verify.py | tee /tmp/n11-compact-optimized.json
          cmp /tmp/n11-compact-normal.json /tmp/n11-compact-optimized.json
          python - <<'PY'
          import json
          from pathlib import Path
          actual = json.loads(Path('/tmp/n11-compact-normal.json').read_text())
          saved = json.loads(Path('expeditions/015-n11-mixture/compact-result.json').read_text())
          if actual != saved:
              raise SystemExit('saved compact result differs from actual execution')
          print('Three-orbit certificate matches actual exact execution; n11 Lean not run.')
          PY
