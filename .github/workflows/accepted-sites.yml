name: Accepted RS sites
on:
  push:
    branches: [main]
    paths:
      - 'expeditions/042-accepted-sites/*.py'
      - 'expeditions/042-accepted-sites/*.json'
      - 'expeditions/041-two-level-distance/two_level_oracle.py'
      - 'expeditions/041-two-level-distance/check_outer_application.py'
      - '.github/workflows/accepted-sites.yml'
  pull_request:
    paths:
      - 'expeditions/042-accepted-sites/*.py'
      - 'expeditions/042-accepted-sites/*.json'
      - 'expeditions/041-two-level-distance/two_level_oracle.py'
      - 'expeditions/041-two-level-distance/check_outer_application.py'
      - '.github/workflows/accepted-sites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: expeditions/042-accepted-sites
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reproduce each certificate and its controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python --version
          while read -r script expected; do
            python "$script" > "$RUNNER_TEMP/actual.json"
            python -O "$script" > "$RUNNER_TEMP/optimized.json"
            cmp "$expected" "$RUNNER_TEMP/actual.json"
            cmp "$expected" "$RUNNER_TEMP/optimized.json"
            sha256sum "$expected"
            cat "$expected"
          done <<'CASES'
          physical_patch.py physical-patch.json
          check_mixing.py mixing-checks.json
          check_two_level.py two-level-checks.json
          check_parity_recovery.py parity-recovery-checks.json
          CASES
