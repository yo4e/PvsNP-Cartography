name: Lean formal audit

on:
  push:
    branches: ["main"]
    paths:
      - "formal/**"
      - ".github/workflows/lean.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "formal/**"
      - ".github/workflows/lean.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf             https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh             | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned Lean and Mathlib
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          lake --version
          lake update
          echo "----- lake-manifest.json -----"
          cat lake-manifest.json

      - name: Build and audit axioms
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
          axiom-audit: true
          axiom-audit-root: PvsNPCartography

      - name: Print target theorem axioms
        working-directory: formal
        run: ./scripts/axiom_report.sh
