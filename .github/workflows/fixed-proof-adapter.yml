name: Fixed proof adapter exact controls
on:
  push:
    branches: [main]
    paths:
      - 'expeditions/035-fixed-proof-adapter/*.py'
      - 'expeditions/035-fixed-proof-adapter/*.json'
      - 'expeditions/036-query-capacity/*.py'
      - 'expeditions/036-query-capacity/*.json'
      - '.github/workflows/fixed-proof-adapter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'expeditions/035-fixed-proof-adapter/*.py'
      - 'expeditions/035-fixed-proof-adapter/*.json'
      - 'expeditions/036-query-capacity/*.py'
      - 'expeditions/036-query-capacity/*.json'
      - '.github/workflows/fixed-proof-adapter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Reproduce actual polynomial, weighted-mixture and threshold controls
        shell: bash
        run: |
          set -euo pipefail
          python --version
          git rev-parse HEAD
          P=expeditions/035-fixed-proof-adapter
          python "$P/verify_adapter.py" > /tmp/fixed-proof.json
          python -O "$P/verify_adapter.py" > /tmp/fixed-proof-O.json
          cmp /tmp/fixed-proof.json /tmp/fixed-proof-O.json
          cmp /tmp/fixed-proof.json "$P/checks.json"
          python -m py_compile "$P/verify_adapter.py"
          sha256sum "$P/verify_adapter.py" "$P/checks.json" /tmp/fixed-proof.json
          cat /tmp/fixed-proof.json
      - name: Reproduce the query-concentration counterfamily and weighted bound
        shell: bash
        run: |
          set -euo pipefail
          P=expeditions/035-fixed-proof-adapter
          python "$P/query_pressure.py" > /tmp/query-pressure.json
          python -O "$P/query_pressure.py" > /tmp/query-pressure-O.json
          cmp /tmp/query-pressure.json /tmp/query-pressure-O.json
          cmp /tmp/query-pressure.json "$P/query-pressure.json"
          python -m py_compile "$P/query_pressure.py"
          sha256sum "$P/query_pressure.py" "$P/query-pressure.json" /tmp/query-pressure.json
          cat /tmp/query-pressure.json
      - name: Reproduce allocation cuts, primal flows and signed countermodels
        shell: bash
        run: |
          set -euo pipefail
          P=expeditions/036-query-capacity
          python "$P/verify_capacity.py" > /tmp/query-capacity.json
          python -O "$P/verify_capacity.py" > /tmp/query-capacity-O.json
          cmp /tmp/query-capacity.json /tmp/query-capacity-O.json
          cmp /tmp/query-capacity.json "$P/checks.json"
          python -m py_compile "$P/verify_capacity.py"
          echo '885fc7a094629688166a022383e819c4ce0ea3835285cfa35a1b06c3a3341041  expeditions/036-query-capacity/verify_capacity.py' | sha256sum -c -
          echo '8a5564e6040877437dee1ce1ece8f1e70ae120281fd13ae2d358080227de79bd  /tmp/query-capacity.json' | sha256sum -c -
          sha256sum "$P/verify_capacity.py" "$P/checks.json" /tmp/query-capacity.json
          cat /tmp/query-capacity.json
      - name: Reproduce the sharp non-tautological signed-OR factor-four bound
        shell: bash
        run: |
          set -euo pipefail
          P=expeditions/036-query-capacity
          python "$P/verify_signed_gap.py" > /tmp/signed-gap.json
          python -O "$P/verify_signed_gap.py" > /tmp/signed-gap-O.json
          cmp /tmp/signed-gap.json /tmp/signed-gap-O.json
          cmp /tmp/signed-gap.json "$P/signed-gap.json"
          python -m py_compile "$P/verify_signed_gap.py"
          echo '4aa75bc471e55283a557c667be3177a90a38286571faee2a0d05d1404bf3b64a  expeditions/036-query-capacity/verify_signed_gap.py' | sha256sum -c -
          echo '7d260a7e3f4cccba28647a9f28dc982f28876dcdca66af5533b3f22a8db2a081  /tmp/signed-gap.json' | sha256sum -c -
          sha256sum "$P/verify_signed_gap.py" "$P/signed-gap.json" /tmp/signed-gap.json
          cat /tmp/signed-gap.json
