name: Bounded shared-DAG diagnostic
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/dag-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain and Mathlib without project build-cache restoration
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          lake --version
          lake update
      - name: Bounded strict compilation of the repaired shared-DAG endpoints
        working-directory: formal
        shell: bash
        run: |
          set -euo pipefail
          echo 'DIAGNOSTIC ONLY: not whole-root acceptance or an independent kernel'
          timeout 300s lake build --wfail PvsNPCartography.DAGBoundary
          lake env lean DAGAudit.lean
